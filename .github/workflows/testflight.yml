name: TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    name: Build and upload TestFlight IPA
    runs-on: macos-26-intel
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TestFlight secrets
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_P8 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1 || true)"
          if [ -z "${XCODE_PATH}" ]; then
            XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1 || true)"
          fi
          if [ -n "${XCODE_PATH}" ]; then
            sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"
          else
            echo "No Xcode app bundle found under /Applications; using the runner default selection" >&2
            xcode-select -p || true
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: Refresh iOS pods
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update

      - name: Build Flutter iOS artifacts without codesigning
        run: |
          set -euo pipefail
          TESTFLIGHT_BUILD_NUMBER="$((5000 + GITHUB_RUN_NUMBER))"
          echo "Building døPe TestFlight build ${TESTFLIGHT_BUILD_NUMBER}"
          flutter build ios --release --no-codesign --no-pub --build-number="${TESTFLIGHT_BUILD_NUMBER}"

      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          printf '%s' "${APP_STORE_CONNECT_API_KEY_P8}" > "${PWD}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive unsigned app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          TESTFLIGHT_BUILD_NUMBER="$((5000 + GITHUB_RUN_NUMBER))"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/dope.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${TESTFLIGHT_BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Export App Store Connect IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build/export
          cp ExportOptions.plist build/ExportOptions.generated.plist
          /usr/libexec/PlistBuddy -c "Set :manageAppVersionAndBuildNumber false" build/ExportOptions.generated.plist
          /usr/libexec/PlistBuddy -c "Delete :teamID" build/ExportOptions.generated.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" build/ExportOptions.generated.plist
          xcodebuild \
            -exportArchive \
            -archivePath build/dope.xcarchive \
            -exportOptionsPlist build/ExportOptions.generated.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${PWD}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}"
          IPA_PATH="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "${IPA_PATH}" ]; then
            echo "No IPA found in build/export" >&2
            find build/export -maxdepth 2 -type f -print
            exit 1
          fi
          shasum -a 256 "${IPA_PATH}" | tee build/export/ipa.sha256

      - name: Upload TestFlight IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: døPe-testflight-ipa-${{ github.run_number }}
          path: |
            build/export/*.ipa
            build/export/ipa.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "${IPA_PATH}" ]; then
            echo "No IPA found in build/export" >&2
            find build/export -maxdepth 2 -type f -print
            exit 1
          fi
          export IPA_PATH
          .github/scripts/upload_to_testflight.sh

      - name: Finalize TestFlight build metadata
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DOPI_APP_BUNDLE_ID: app.mo1.player.39A8Q3T3TR
          DOPI_APP_LOCALE: en-US
          DOPI_BETA_GROUP_NAME: døPe Public Beta
          DOPI_BETA_APP_DESCRIPTION: >-
            døPe is a retro music player for iPhone and iPad. Test local MP3 import, optional Apple Music browsing for devices signed into an active Apple Music subscription, album carousel, lyrics, equalizer controls, song transitions, and radial navigation.
          DOPI_BETA_FEEDBACK_EMAIL: bobbytatum12345@gmail.com
          DOPI_BETA_CONTACT_EMAIL: bobbytatum12345@gmail.com
          DOPI_BETA_REVIEW_NOTES: >-
            No demo account is required. Reviewers can fully test local MP3 import and on-device playback without signing in. Apple Music features are optional and require a device signed into an active Apple Music subscription. Camera and photo library access are only used if the reviewer chooses custom album artwork.
          DOPI_PRIVACY_POLICY_URL: https://cdn.jsdelivr.net/gh/NightVibes33/mo1@main/privacy-policy.html
          DOPI_USES_NON_EXEMPT_ENCRYPTION: "false"
        run: |
          set -euo pipefail
          export DOPI_TARGET_BUILD_VERSION="$((5000 + GITHUB_RUN_NUMBER))"
          ruby tool/app_store_connect_public_link.rb
