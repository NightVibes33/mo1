name: TestFlight

on:
  workflow_dispatch:
    inputs:
      unsigned_ipa:
        description: Build unsigned iOS IPA artifact
        type: boolean
        default: true
      android_apk:
        description: Build Android APK artifact
        type: boolean
        default: true
      upload_testflight:
        description: Upload signed IPA to TestFlight
        type: boolean
        default: false
      ios_build_number:
        description: Optional explicit iOS/TestFlight build number (must be higher than the latest uploaded build)
        required: false
        type: string
        default: ""
  push:
    branches:
      - main

jobs:
  unsigned_ipa:
    if: ${{ github.event_name == 'push' || inputs.unsigned_ipa }}
    name: Build unsigned iOS IPA
    runs-on: macos-26-intel
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1 || true)"
          if [ -z "${XCODE_PATH}" ]; then
            XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1 || true)"
          fi
          if [ -n "${XCODE_PATH}" ]; then
            sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"
          else
            echo "No Xcode app bundle found under /Applications; using the runner default selection" >&2
            xcode-select -p || true
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build unsigned iOS app
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          DART_DEFINES=()
          if [ -n "${YOUTUBE_API_KEY:-}" ]; then
            DART_DEFINES+=("--dart-define=YOUTUBE_API_KEY=${YOUTUBE_API_KEY}")
          fi
          BUILD_NUMBER="${{ inputs.ios_build_number }}"
          if [ -z "${BUILD_NUMBER}" ]; then
            BUILD_NUMBER="$((5000 + GITHUB_RUN_NUMBER))"
          fi
          flutter build ios --release --no-codesign --no-pub --build-number="${BUILD_NUMBER}" "${DART_DEFINES[@]}"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No Runner.app found at $APP_PATH" >&2
            find build/ios -maxdepth 4 -type d | sort
            exit 1
          fi
          rm -rf build/Payload build/døPe-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/døPe.app
          cd build
          /usr/bin/zip -qry døPe-unsigned.ipa Payload
          ls -lh døPe-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: døPe-unsigned-ipa-${{ github.run_number }}
          path: build/døPe-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

  android_apk:
    if: ${{ github.event_name == 'push' || inputs.android_apk }}
    name: Build Android APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Derive Android version name
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          if [ -z "${VERSION_NAME}" ]; then
            echo "Unable to derive version name from pubspec.yaml" >&2
            exit 1
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"

      - name: Build Android APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          DART_DEFINES=()
          if [ -n "${YOUTUBE_API_KEY:-}" ]; then
            DART_DEFINES+=("--dart-define=YOUTUBE_API_KEY=${YOUTUBE_API_KEY}")
          fi
          flutter build apk --release --flavor production --build-name "${VERSION_NAME}" --target-platform android-arm,android-arm64,android-x64 "${DART_DEFINES[@]}"
          APK_DIR="build/app/outputs/flutter-apk"
          APK_SOURCE=""
          for candidate in \
            "$APK_DIR/app-production-release.apk" \
            "$APK_DIR/app-release.apk" \
            "$APK_DIR/app-production-release-production.apk"
          do
            if [ -f "$candidate" ]; then
              APK_SOURCE="$candidate"
              break
            fi
          done
          if [ -z "$APK_SOURCE" ]; then
            echo "No APK output found in $APK_DIR" >&2
            ls -la "$APK_DIR" || true
            exit 1
          fi
          cp "$APK_SOURCE" "$APK_DIR/dope-android.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: døPe-android-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/dope-android.apk
          retention-days: 30
          if-no-files-found: error

  upload_testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
    name: Build and upload TestFlight IPA
    runs-on: macos-26-intel
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TestFlight secrets
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_P8 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1 || true)"
          if [ -z "${XCODE_PATH}" ]; then
            XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1 || true)"
          fi
          if [ -n "${XCODE_PATH}" ]; then
            sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"
          else
            echo "No Xcode app bundle found under /Applications; using the runner default selection" >&2
            xcode-select -p || true
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: Refresh iOS pods
        run: |
          set -euo pipefail
          cd ios
          pod install

      - name: Build Flutter iOS artifacts without codesigning
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          DART_DEFINES=()
          if [ -n "${YOUTUBE_API_KEY:-}" ]; then
            DART_DEFINES+=("--dart-define=YOUTUBE_API_KEY=${YOUTUBE_API_KEY}")
          fi
          TESTFLIGHT_BUILD_NUMBER="${{ inputs.ios_build_number }}"
          if [ -z "${TESTFLIGHT_BUILD_NUMBER}" ]; then
            TESTFLIGHT_BUILD_NUMBER="$((5000 + GITHUB_RUN_NUMBER))"
          fi
          echo "Building døPe TestFlight build ${TESTFLIGHT_BUILD_NUMBER}"
          echo "TESTFLIGHT_BUILD_NUMBER=${TESTFLIGHT_BUILD_NUMBER}" >> "${GITHUB_ENV}"
          flutter build ios --release --no-codesign --no-pub --build-number="${TESTFLIGHT_BUILD_NUMBER}" "${DART_DEFINES[@]}"

      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          printf '%s' "${APP_STORE_CONNECT_API_KEY_P8}" > "${PWD}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive unsigned app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          TESTFLIGHT_BUILD_NUMBER="${TESTFLIGHT_BUILD_NUMBER:-${{ inputs.ios_build_number }}}"
          if [ -z "${TESTFLIGHT_BUILD_NUMBER}" ]; then
            TESTFLIGHT_BUILD_NUMBER="$((5000 + GITHUB_RUN_NUMBER))"
          fi
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/dope.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${TESTFLIGHT_BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Export App Store Connect IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build/export
          cp ExportOptions.plist build/ExportOptions.generated.plist
          /usr/libexec/PlistBuddy -c "Set :manageAppVersionAndBuildNumber false" build/ExportOptions.generated.plist
          /usr/libexec/PlistBuddy -c "Delete :teamID" build/ExportOptions.generated.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" build/ExportOptions.generated.plist
          xcodebuild \
            -exportArchive \
            -archivePath build/dope.xcarchive \
            -exportOptionsPlist build/ExportOptions.generated.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${PWD}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}"
          IPA_PATH="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "${IPA_PATH}" ]; then
            echo "No IPA found in build/export" >&2
            find build/export -maxdepth 2 -type f -print
            exit 1
          fi
          shasum -a 256 "${IPA_PATH}" | tee build/export/ipa.sha256

      - name: Upload TestFlight IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: døPe-testflight-ipa-${{ github.run_number }}
          path: |
            build/export/*.ipa
            build/export/ipa.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "${IPA_PATH}" ]; then
            echo "No IPA found in build/export" >&2
            find build/export -maxdepth 2 -type f -print
            exit 1
          fi
          export IPA_PATH
          .github/scripts/upload_to_testflight.sh

      - name: Finalize TestFlight build metadata
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DOPI_APP_BUNDLE_ID: app.mo1.player.39A8Q3T3TR
          DOPI_APP_LOCALE: en-US
          DOPI_BETA_GROUP_NAME: døPe Public Beta
          DOPI_BETA_APP_DESCRIPTION: >-
            døPe is a retro music player for iPhone and iPad. Test local MP3 import, optional Apple Music browsing for devices signed into an active Apple Music subscription, album carousel, lyrics, equalizer controls, song transitions, and radial navigation.
          DOPI_BETA_FEEDBACK_EMAIL: bobbytatum12345@gmail.com
          DOPI_BETA_CONTACT_EMAIL: bobbytatum12345@gmail.com
          DOPI_BETA_REVIEW_NOTES: >-
            No demo account is required. Reviewers can fully test local MP3 import and on-device playback without signing in. Apple Music features are optional and require a device signed into an active Apple Music subscription. Camera and photo library access are only used if the reviewer chooses custom album artwork.
          DOPI_PRIVACY_POLICY_URL: https://cdn.jsdelivr.net/gh/NightVibes33/mo1@main/privacy-policy.html
          DOPI_USES_NON_EXEMPT_ENCRYPTION: "false"
        run: |
          set -euo pipefail
          export DOPI_TARGET_BUILD_VERSION="${TESTFLIGHT_BUILD_NUMBER:-${{ inputs.ios_build_number }}}"
          if [ -z "${DOPI_TARGET_BUILD_VERSION}" ]; then
            export DOPI_TARGET_BUILD_VERSION="$((5000 + GITHUB_RUN_NUMBER))"
          fi
          ruby tool/app_store_connect_public_link.rb
