name: Cancel Unsafe Calibration Build

on:
  push:
    branches:
      - automation/apple-signing-kit
    paths:
      - ".github/workflows/cancel-paleramine-calibration-build.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel current calibration build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/29794714138/cancel" || true
