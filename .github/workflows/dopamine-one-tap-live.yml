name: Dopamine One-Tap Live Installer

on:
  workflow_dispatch:
  push:
    branches:
      - automation/apple-signing-kit
    paths:
      - ".github/workflows/dopamine-one-tap-live.yml"
      - "tool/dopamine_one_tap_server.py"

permissions:
  contents: read

concurrency:
  group: dopamine-one-tap-live
  cancel-in-progress: true

jobs:
  installer:
    name: Live iPad registration and signing service
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_P12_PASSWORD: "1"
      DOPAMINE_BUNDLE_ID: com.nightvibes33.dopamine.ipad5
      DOPAMINE_PROFILE_NAME: Dopamine iPad 5 Ad Hoc

    steps:
      - name: Checkout installer source
        uses: actions/checkout@v4

      - name: Validate Apple API credentials
        run: |
          set -euo pipefail
          missing=0
          for name in APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install runner dependencies
        run: |
          set -euxo pipefail
          brew install make openssl cloudflared
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --quiet pyjwt cryptography requests
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Clone experimental Dopamine branch
        run: |
          set -euxo pipefail
          git clone --recurse-submodules --branch research/ipad5-darksword https://github.com/NightVibes33/Dopamine.git dopamine
          cd dopamine
          python3 research/ipad5_darksword_patch.py
          git diff --check

      - name: Install Theos SDK
        run: |
          set -euxo pipefail
          cd dopamine
          export BASEDIR="$PWD"
          export THEOS="${BASEDIR}/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

      - name: Build trustcache tool
        run: |
          set -euxo pipefail
          cd dopamine
          git clone --depth 1 https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Build experimental Dopamine IPA
        run: |
          set -euxo pipefail
          cd dopamine
          export BASEDIR="$PWD"
          export THEOS="${BASEDIR}/theos"
          export ctime="$(date -u +'%Y%m%d_%H%M%S')"
          export ctimestamp="$(date +%s)"
          export shorthash="$(git rev-parse --short HEAD)"
          cd Application/Dopamine/Resources
          ./download_bootstraps.sh
          cd ../../..
          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1
          test -f Application/Dopamine.ipa
          shasum -a 256 Application/Dopamine.ipa

      - name: Create Apple distribution certificate and P12
        id: certificate
        run: |
          set -euo pipefail
          mkdir -p signing installer-output
          openssl genrsa -out signing/distribution.key 2048
          openssl req -new -sha256 \
            -key signing/distribution.key \
            -subj "/CN=NightVibes33 Dopamine Installer/O=NightVibes33/C=US" \
            -out signing/distribution.csr

          .venv/bin/python - <<'PY'
          import base64, json, os, time
          from pathlib import Path
          import jwt, requests

          key = os.environ["APP_STORE_CONNECT_API_KEY_P8"].replace("\\n", "\n")
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["APP_STORE_CONNECT_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
              key,
              algorithm="ES256",
              headers={"kid": os.environ["APP_STORE_CONNECT_KEY_ID"], "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          csr = Path("signing/distribution.csr").read_text()
          last = None
          for cert_type in ("DISTRIBUTION", "IOS_DISTRIBUTION"):
              body = {"data": {"type": "certificates", "attributes": {"certificateType": cert_type, "csrContent": csr}}}
              response = requests.post("https://api.appstoreconnect.apple.com/v1/certificates", headers=headers, json=body, timeout=60)
              if response.status_code == 201:
                  data = response.json()["data"]
                  Path("signing/certificate.id").write_text(data["id"])
                  Path("signing/distribution.cer").write_bytes(base64.b64decode(data["attributes"]["certificateContent"]))
                  print(f"Created {cert_type} certificate {data['id']}")
                  break
              last = f"{response.status_code}: {response.text}"
          else:
              raise SystemExit(f"Unable to create Apple distribution certificate: {last}")
          PY

          openssl x509 -inform DER -in signing/distribution.cer -out signing/distribution.pem
          openssl pkcs12 -export \
            -inkey signing/distribution.key \
            -in signing/distribution.pem \
            -name "Dopamine Installer Distribution" \
            -out signing/Dopamine-Distribution.p12 \
            -passout pass:"${APPLE_P12_PASSWORD}"
          echo "APPLE_CERTIFICATE_ID=$(cat signing/certificate.id)" >> "$GITHUB_ENV"
          echo "APPLE_P12_PATH=$PWD/signing/Dopamine-Distribution.p12" >> "$GITHUB_ENV"

      - name: Import signing identity into temporary keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/dopamine-installer.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APPLE_P12_PATH" -k "$KEYCHAIN" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Dopamine Installer Distribution|Apple Distribution|iPhone Distribution/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            security find-identity -v -p codesigning "$KEYCHAIN"
            echo "::error::No imported code-signing identity found"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Start one-tap installer service
        run: |
          set -euo pipefail
          SESSION="$(openssl rand -hex 20)"
          CHALLENGE="$(openssl rand -hex 32)"
          echo "INSTALLER_SESSION=$SESSION" >> "$GITHUB_ENV"
          echo "INSTALLER_CHALLENGE=$CHALLENGE" >> "$GITHUB_ENV"
          export INSTALLER_SESSION="$SESSION"
          export INSTALLER_CHALLENGE="$CHALLENGE"
          export UNSIGNED_IPA="$PWD/dopamine/Application/Dopamine.ipa"
          export OUTPUT_DIR="$PWD/installer-output"
          nohup .venv/bin/python tool/dopamine_one_tap_server.py > installer-output/server.log 2>&1 &
          echo $! > installer-output/server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health

      - name: Publish secure HTTPS tunnel
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > installer-output/tunnel.log 2>&1 &
          echo $! > installer-output/tunnel.pid
          URL=""
          for i in $(seq 1 90); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' installer-output/tunnel.log | head -n 1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then
            cat installer-output/tunnel.log
            echo "::error::Cloudflare tunnel URL was not created"
            exit 1
          fi
          echo "$URL" > installer-output/installer-url.txt
          echo "INSTALLER_URL=$URL" >> "$GITHUB_ENV"
          echo "::notice title=Dopamine Installer::$URL"
          {
            echo "# Dopamine iPad 5 One-Tap Installer"
            echo
            echo "Open this URL in Safari on the iPad:"
            echo
            echo "## $URL"
            echo
            echo "This live installer remains active only while this workflow job is running."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep installer online
        run: |
          set -euo pipefail
          echo "DOPAMINE_INSTALLER_URL=$INSTALLER_URL"
          echo "The service is live. Waiting for iPad enrollment and install requests."
          SERVER_PID="$(cat installer-output/server.pid)"
          TUNNEL_PID="$(cat installer-output/tunnel.pid)"
          END=$((SECONDS + 19800))
          while [ "$SECONDS" -lt "$END" ]; do
            kill -0 "$SERVER_PID" 2>/dev/null || { echo "Server stopped"; cat installer-output/server.log; exit 1; }
            kill -0 "$TUNNEL_PID" 2>/dev/null || { echo "Tunnel stopped"; cat installer-output/tunnel.log; exit 1; }
            tail -n 8 installer-output/server.log || true
            sleep 30
          done

      - name: Upload signing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-one-tap-session
          path: |
            installer-output/
            signing/Dopamine-Distribution.p12
          retention-days: 1
          if-no-files-found: warn
