name: App Store Review Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Set App Store review metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set metadata and upload screenshots
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DOPI_APP_BUNDLE_ID: app.mo1.player.39A8Q3T3TR
          DOPI_APP_LOCALE: en-US
          DOPI_PRIMARY_CATEGORY_ID: MUSIC
          DOPI_PRIVACY_POLICY_URL: https://cdn.jsdelivr.net/gh/NightVibes33/mo1@main/privacy-policy.html
          DOPI_COPYRIGHT: 2026 NightVibes33
          DOPI_CONTENT_RIGHTS_DECLARATION: USES_THIRD_PARTY_CONTENT
          DOPI_USES_NON_EXEMPT_ENCRYPTION: "false"
          DOPI_APP_DESCRIPTION: >-
            doPi is a retro music player for iPhone and iPad built for personal music libraries. Import your own MP3 files, optionally connect your own Apple Music subscription, browse albums with a visual carousel, view lyrics, tune playback with an equalizer, and use smooth song transitions in a focused player built for music fans.
          DOPI_APP_KEYWORDS: music player,mp3,apple music,album carousel,lyrics,equalizer,audio player
          DOPI_SUPPORT_URL: https://github.com/NightVibes33/mo1
          DOPI_SCREENSHOT_ROOT: app_store/screenshots/exports
        run: ruby tool/app_store_connect_review_metadata.rb
