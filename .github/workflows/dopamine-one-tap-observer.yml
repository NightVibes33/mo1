name: Dopamine One-Tap Run Observer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/dopamine-one-tap-live.yml"
      - ".github/workflows/dopamine-one-tap-observer.yml"
      - "tool/dopamine_one_tap_server.py"

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest live installer run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/dopamine-one-tap-live.yml/runs?branch=${HEAD_BRANCH}&per_page=5" \
            > live-runs.json
          RUN_ID="$(jq -r '.workflow_runs[0].id // empty' live-runs.json)"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No live installer run found"
            exit 1
          fi
          jq -r '.workflow_runs[] | ["LIVE_RUN", ("id=" + (.id|tostring)), ("status=" + .status), ("conclusion=" + (.conclusion // "pending")), ("head_sha=" + .head_sha), ("url=" + .html_url)] | join(" ")' live-runs.json
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=10" \
            > jobs.json
          JOB_ID="$(jq -r '.jobs[0].id // empty' jobs.json)"
          jq -r '.jobs[] | ["LIVE_JOB", ("id=" + (.id|tostring)), ("status=" + .status), ("conclusion=" + (.conclusion // "pending")), ("name=" + .name)] | join(" ")' jobs.json
          if [ -z "$JOB_ID" ]; then
            exit 0
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            > job-logs.bin
          if unzip -tq job-logs.bin >/dev/null 2>&1; then
            unzip -p job-logs.bin > job.log
          else
            cp job-logs.bin job.log
          fi
          echo "LIVE_JOB_LINKER_LINES_BEGIN"
          grep -E 'Undefined symbols|library not found|symbol\(s\) not found|ld: |linker command failed' job.log | tail -n 50 | cut -c1-1200 || true
          echo "LIVE_JOB_LINKER_LINES_END"
          echo "LIVE_JOB_BUILD_ERRORS_BEGIN"
          grep -Ei 'fatal error:|[[:space:]]error:|gmake.*Error|Process completed with exit code' job.log | tail -n 40 | cut -c1-1200 || true
          echo "LIVE_JOB_BUILD_ERRORS_END"
          # observer refresh 2026-07-20T01:00:00-05:00
