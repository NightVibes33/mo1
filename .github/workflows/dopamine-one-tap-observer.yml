name: Dopamine One-Tap Run Observer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/dopamine-one-tap-live.yml"
      - ".github/workflows/dopamine-one-tap-fast.yml"
      - ".github/workflows/dopamine-one-tap-observer.yml"
      - "tool/dopamine_one_tap_server.py"

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest fast installer run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/dopamine-one-tap-fast.yml/runs?branch=${HEAD_BRANCH}&per_page=5" \
            > fast-runs.json
          RUN_ID="$(jq -r '.workflow_runs[0].id // empty' fast-runs.json)"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No fast installer run found"
            exit 1
          fi
          jq -r '.workflow_runs[] | ["FAST_RUN", ("id=" + (.id|tostring)), ("status=" + .status), ("conclusion=" + (.conclusion // "pending")), ("head_sha=" + .head_sha), ("url=" + .html_url)] | join(" ")' fast-runs.json
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=10" \
            > jobs.json
          JOB_ID="$(jq -r '.jobs[0].id // empty' jobs.json)"
          JOB_STATUS="$(jq -r '.jobs[0].status // empty' jobs.json)"
          jq -r '.jobs[] | ["FAST_JOB", ("id=" + (.id|tostring)), ("status=" + .status), ("conclusion=" + (.conclusion // "pending")), ("name=" + .name)] | join(" ")' jobs.json
          if [ -z "$JOB_ID" ] || [ "$JOB_STATUS" != "completed" ]; then
            exit 0
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            > job-logs.bin
          if unzip -tq job-logs.bin >/dev/null 2>&1; then
            unzip -p job-logs.bin > job.log
          else
            cp job-logs.bin job.log
          fi
          echo "FAST_JOB_IMPORTANT_LINES_BEGIN"
          grep -Ei 'Created (DISTRIBUTION|IOS_DISTRIBUTION)|DOPAMINE_INSTALLER_URL=|trycloudflare\.com|fatal error:|[[:space:]]error:|failed|Process completed with exit code' job.log | tail -n 100 | cut -c1-1600 || true
          echo "FAST_JOB_IMPORTANT_LINES_END"
