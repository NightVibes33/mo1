name: Paleramine OTA Status Probe

on:
  workflow_dispatch:
  push:
    branches:
      - automation/apple-signing-kit
    paths:
      - ".github/workflows/paleramine-ota-probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/apple-signing-kit
      - name: Record Paleramine workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=automation/apple-signing-kit&per_page=30" \
            --jq '{runs: [.workflow_runs[] | {id,name,path,status,conclusion,head_sha,run_number,event,created_at,updated_at,html_url}]}' \
            > paleramine-ota-runs.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add paleramine-ota-runs.json
          git commit -m 'Record Paleramine OTA workflow status' || exit 0
          git push origin HEAD:automation/apple-signing-kit

