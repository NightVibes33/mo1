name: Paleramine OTA Disabled

on:
  workflow_dispatch:
  push:
    branches:
      - automation/apple-signing-kit
    paths:
      - ".github/workflows/dopamine-profile-ota.yml"

permissions:
  contents: read

concurrency:
  group: paleramine-profile-ota-live
  cancel-in-progress: true

jobs:
  disabled:
    name: Paleramine OTA disabled after unsafe observation build
    runs-on: ubuntu-latest
    steps:
      - name: Stop publication
        run: |
          echo "The Paleramine observation OTA is disabled."
          echo "Do not publish another IPA until kernel entry and runtime activation are verified."
