name: App Store Update Wording

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-wording:
    name: Update App Store wording only
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update wording only
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DOPI_APP_BUNDLE_ID: app.mo1.player.39A8Q3T3TR
          DOPI_PLATFORM: IOS
          DOPI_APP_LOCALE: en-US
          DOPI_APP_NAME: ClassiPod
          DOPI_APP_SUBTITLE: Retro Click Wheel Music Player
          DOPI_APP_DESCRIPTION: >-
            ClassiPod turns your iPhone into a retro click-wheel music player for the library you actually own. Spin the wheel to browse your songs, flip through albums in a cover carousel, and play your music the way it used to feel. Import your own MP3 files with no subscription needed, connect your own Apple Music library, or stream from your Navidrome or Jellyfin server. Features a 10-band custom equalizer with presets, time-synced lyrics, editable song info, home screen widgets, lock screen controls, and click-wheel navigation with haptics. No ads. No tracking. Just your music.
          DOPI_APP_KEYWORDS: click wheel,retro,classic,music player,mp3,offline,navidrome,jellyfin,equalizer,lyrics,cover flow
          DOPI_SUPPORT_URL: https://github.com/NightVibes33/mo1
          DOPI_BETA_APP_DESCRIPTION: >-
            ClassiPod is a retro music player for iPhone and iPad. Test local MP3 import, optional Apple Music browsing for devices signed into an active Apple Music subscription, album carousel, lyrics, equalizer controls, song transitions, and radial navigation.
          DOPI_REVIEW_NOTES: >-
            No demo account is required. Reviewers can fully test local MP3 import and on-device playback without signing in. Apple Music features are optional and require a device signed into an active Apple Music subscription. Camera and photo library access are only used if the reviewer chooses custom album artwork.
          DOPI_BETA_FEEDBACK_EMAIL: bobbytatum12345@gmail.com
          DOPI_PRIVACY_POLICY_URL: https://cdn.jsdelivr.net/gh/NightVibes33/mo1@main/privacy-policy.html
        run: ruby tool/app_store_connect_update_wording.rb
