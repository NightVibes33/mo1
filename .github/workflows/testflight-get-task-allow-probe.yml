name: TestFlight get-task-allow probe

on:
  push:
    branches:
      - tf-get-task-allow-probe-20260928
    paths:
      - '.github/workflows/testflight-get-task-allow-probe.yml'
      - '.github/scripts/patch-appstore-probe.py'
      - 'LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: LiveContainer TestFlight get-task-allow
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      PROBE_BUNDLE_ID: com.nightvibes.prism.39A8Q3T3TR
      PROBE_VERSION: 0.0.1
      PROBE_BUILD: ${{ github.run_number }}

    steps:
      - name: Checkout LiveContainer mirror
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify mirrored LiveContainer source
        run: |
          set -euo pipefail
          test "$(cat .livecontainer-source-sha)" = "681df870dbcd90236af50c997fc91d40e2fb9458"
          test -f LiveContainer/LCBootstrap.m
          test -f LiveContainer.xcodeproj/project.pbxproj
          grep -q 'LCSelected32BitEmulator' LiveContainer/LCBootstrap.m
          git submodule status

      - name: Validate Apple secrets
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Select Xcode 27 GM
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_27.app"
          test -d "${XCODE_PATH}"
          sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"

          VERSION="$(xcodebuild -version)"
          echo "${VERSION}"
          echo "${VERSION}" | grep -q '^Xcode 27'
          xcrun --sdk iphoneos --show-sdk-version

      - name: Create or locate App Store Connect app
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --quiet --upgrade pip
          .probe-venv/bin/python -m pip install --quiet PyJWT cryptography
          .probe-venv/bin/python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import jwt

          BASE = "https://api.appstoreconnect.apple.com"
          KEY_ID = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          ISSUER_ID = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          raw_key = os.environ["APP_STORE_CONNECT_API_KEY_P8"].strip()
          bundle_id = os.environ["PROBE_BUNDLE_ID"]

          def normalize_key(value):
              value = value.replace("\\n", "\n").strip()
              if "BEGIN PRIVATE KEY" in value or "BEGIN EC PRIVATE KEY" in value:
                  return value
              compact = "".join(value.split())
              return base64.b64decode(compact + "=" * (-len(compact) % 4)).decode()

          PRIVATE_KEY = normalize_key(raw_key)

          def make_token():
              now = int(time.time())
              return jwt.encode(
                  {"iss": ISSUER_ID, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                  PRIVATE_KEY,
                  algorithm="ES256",
                  headers={"kid": KEY_ID, "typ": "JWT"},
              )

          def request(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"Authorization": "Bearer " + make_token(), "Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"{method} {path} -> HTTP {exc.code}: {body[:2000]}")

          bundle_ids = [
              bundle_id,
              bundle_id + ".LiveProcess",
              bundle_id + ".LaunchAppExtension",
              bundle_id + ".ShareExtension",
          ]
          for identifier in bundle_ids:
              q = urllib.parse.urlencode({"filter[identifier]": identifier, "limit": "10"})
              rows = request("GET", "/v1/bundleIds?" + q).get("data", [])
              if not rows:
                  created = request("POST", "/v1/bundleIds", {
                      "data": {
                          "type": "bundleIds",
                          "attributes": {
                              "identifier": identifier,
                              "name": ("LiveContainer NV33 " + identifier.split(".")[-1])[:100],
                              "platform": "IOS"
                          }
                      }
                  })["data"]
                  print("Created Bundle ID:", identifier, created["id"])
              else:
                  print("Bundle ID already exists:", identifier, rows[0]["id"])

          q = urllib.parse.urlencode({"filter[bundleId]": bundle_id, "limit": "10"})
          apps = request("GET", "/v1/apps?" + q).get("data", [])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              if not apps:
                  print("No App Store Connect app record exists yet for:", bundle_id)
                  f.write("ASC_APP_RECORD_EXISTS=false\n")
              else:
                  app = apps[0]
                  attrs = app.get("attributes", {})
                  app_id = app["id"]
                  apple_id = attrs.get("appleId") or app_id
                  print("App Store Connect app record already exists.")
                  print("ASC app id:", app_id)
                  print("Apple id:", apple_id)
                  f.write("ASC_APP_RECORD_EXISTS=true\n")
                  f.write(f"ASC_APP_ID={app_id}\n")
                  f.write(f"ASC_APP_APPLE_ID={apple_id}\n")
          PY

      - name: Prepare App Store signing probe entitlements
        run: |
          set -euo pipefail
          cat > entitlements.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          EOF

          for entitlement in LiveProcess/LiveProcess.entitlements LaunchAppExtension/LaunchAppExtension.entitlements ShareExtension/ShareExtension.entitlements
          do
            cat > "$entitlement" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          EOF
          done

          plutil -p entitlements.xml

      - name: Patch App Store public API compatibility
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-appstore-probe.py

      - name: Build unsigned LiveContainer archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          rm -rf build/TestFlightProbe.xcarchive build/testflight-export probe-logs
          mkdir -p build probe-logs

          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TestFlightProbe.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            LIVECONTAINER_BUNDLE_IDENTIFIER="${PROBE_BUNDLE_ID}" \
            CURRENT_PROJECT_VERSION="${PROBE_BUILD}" \
            MARKETING_VERSION="${PROBE_VERSION}" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            EMBEDDED_CONTENT_CONTAINS_SWIFT=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee probe-logs/archive.log

          test -d build/TestFlightProbe.xcarchive/Products/Applications/LiveContainer.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/TestFlightProbe.xcarchive/Products/Applications/LiveContainer.app/Info.plist

      - name: Remove App Store-invalid optional components
        run: |
          set -euo pipefail
          APP="build/TestFlightProbe.xcarchive/Products/Applications/LiveContainer.app"

          # These are optional LiveContainer integration/multitask/tweak components that
          # currently depend on private extension points or private APIs. Keep them out
          # of this TestFlight flavor rather than attempting to disguise those APIs.
          rm -rf "$APP/PlugIns"
          rm -rf "$APP/Frameworks/SideStoreSupport.framework"

          # Keep the guest-execution stack in this flavor, but make the embedded
          # CydiaSubstrate framework metadata App Store structurally valid.
          SUBSTRATE_PLIST="$APP/Frameworks/CydiaSubstrate.framework/Info.plist"
          if [ -f "$SUBSTRATE_PLIST" ]; then
            /usr/libexec/PlistBuddy -c 'Delete :MinimumOSVersion' "$SUBSTRATE_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Add :MinimumOSVersion string 15.0' "$SUBSTRATE_PLIST"
          fi

          # App Store validation requires a launch screen for iPad multitasking.
          /usr/libexec/PlistBuddy -c 'Delete :UILaunchStoryboardName' "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Delete :UILaunchScreen' "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UILaunchScreen dict' "$APP/Info.plist"

          # Give every probe a unique App Store build number.
          TF_BUILD="$((100000 + GITHUB_RUN_NUMBER))"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TF_BUILD" "$APP/Info.plist"
          echo "TESTFLIGHT_BUILD_NUMBER=$TF_BUILD" >> "$GITHUB_ENV"

          echo "Remaining embedded payload:"
          find "$APP/Frameworks" -maxdepth 2 -type f -print | sort || true
          find "$APP/PlugIns" -maxdepth 2 -type f -print 2>/dev/null | sort || true

      - name: Embed Swift runtime compatibility libraries
        run: |
          set -euo pipefail
          APP="build/TestFlightProbe.xcarchive/Products/Applications/LiveContainer.app"
          FRAMEWORKS="$APP/Frameworks"
          RUNTIME_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          ARCHIVE_SUPPORT="build/TestFlightProbe.xcarchive/SwiftSupport/iphoneos"

          test -d "$FRAMEWORKS"
          test -d "$RUNTIME_DIR"
          mkdir -p "$ARCHIVE_SUPPORT"

          : > probe-logs/swift-runtime-forced.txt
          while IFS= read -r candidate; do
            if /usr/bin/file "$candidate" | /usr/bin/grep -q 'Mach-O'; then
              /usr/bin/strings "$candidate" 2>/dev/null \
                | /usr/bin/grep -oE '/usr/lib/swift/libswift[^/[:space:]]+\.dylib' \
                | /usr/bin/sed 's#.*/##' \
                >> probe-logs/swift-runtime-forced.txt || true
            fi
          done < <(find "$APP" -type f -print)

          sort -u probe-logs/swift-runtime-forced.txt -o probe-logs/swift-runtime-forced.txt
          echo "Swift runtime libraries referenced by the final archive:"
          cat probe-logs/swift-runtime-forced.txt
          test -s probe-logs/swift-runtime-forced.txt

          while IFS= read -r dylib; do
            [ -n "$dylib" ] || continue
            source="$RUNTIME_DIR/$dylib"
            if [ ! -f "$source" ]; then
              echo "::error::Xcode 27 GM runtime missing required library: $source"
              exit 1
            fi
            cp -p "$source" "$FRAMEWORKS/$dylib"
            cp -p "$source" "$ARCHIVE_SUPPORT/$dylib"
          done < probe-logs/swift-runtime-forced.txt

          echo "Forced app Swift runtimes:"
          find "$FRAMEWORKS" -maxdepth 1 -type f -name 'libswift*.dylib' -print | sort

          echo "Archive SwiftSupport staging:"
          find "$ARCHIVE_SUPPORT" -maxdepth 1 -type f -name 'libswift*.dylib' -print | sort

          test -f "$FRAMEWORKS/libswiftCore.dylib"
          test -f "$ARCHIVE_SUPPORT/libswiftCore.dylib"

      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          printf '%s' "${APP_STORE_CONNECT_API_KEY_P8}" > "${PWD}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Export App Store Connect signed IPA
        id: export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -uo pipefail
          mkdir -p build/testflight-export

          cat > build/ExportOptions.probe.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath build/TestFlightProbe.xcarchive \
            -exportOptionsPlist build/ExportOptions.probe.plist \
            -exportPath build/testflight-export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${PWD}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}" \
            2>&1 | tee probe-logs/export.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Inspect signed IPA
        if: ${{ steps.export.outcome == 'success' }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/testflight-export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          rm -rf build/inspect
          mkdir -p build/inspect
          unzip -q "$IPA_PATH" -d build/inspect
          APP_PATH="$(find build/inspect/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          # Build SwiftSupport using Xcode's own Swift runtime scanner.
          # This scans the host executable and every embedded framework/dylib,
          # including CydiaSubstrate's @rpath/libswift*.dylib dependencies.
          rm -rf build/inspect/SwiftSupport
          SWIFT_STDLIB_TOOL="$(xcrun --find swift-stdlib-tool)"
          test -x "$SWIFT_STDLIB_TOOL"

          "$SWIFT_STDLIB_TOOL" \
            --copy \
            --verbose \
            --platform iphoneos \
            --scan-executable "$APP_PATH/LiveContainer" \
            --scan-folder "$APP_PATH/Frameworks" \
            --unsigned-destination "build/inspect/SwiftSupport" \
            2>&1 | tee probe-logs/swift-stdlib-tool.log

          SWIFT_SUPPORT="build/inspect/SwiftSupport/iphoneos"

          # Xcode 27 can return successfully here without materializing support
          # dylibs for an unsigned archive. Fall back to the actual Mach-O load
          # commands and copy the exact GM runtime dylibs referenced by Payload.
          if [ ! -f "$SWIFT_SUPPORT/libswiftCore.dylib" ]; then
            echo "swift-stdlib-tool produced no SwiftSupport payload; resolving dependencies with otool."
            mkdir -p "$SWIFT_SUPPORT"
            : > probe-logs/swift-runtime-deps.txt

            while IFS= read -r candidate; do
              if /usr/bin/file "$candidate" | /usr/bin/grep -q 'Mach-O'; then
                /usr/bin/otool -L "$candidate" 2>/dev/null \
                  | /usr/bin/awk '$1 ~ /^\\/usr\\/lib\\/swift\\/libswift.*[.]dylib$/ { n=$1; sub(/^.*\\//, "", n); print n }' \
                  >> probe-logs/swift-runtime-deps.txt || true
              fi
            done < <(find "$APP_PATH" -type f -print)

            sort -u probe-logs/swift-runtime-deps.txt -o probe-logs/swift-runtime-deps.txt
            echo "Detected Swift runtime dependencies:"
            cat probe-logs/swift-runtime-deps.txt
            test -s probe-logs/swift-runtime-deps.txt

            SWIFT_RUNTIME_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
            while IFS= read -r dylib; do
              [ -n "$dylib" ] || continue
              source="$SWIFT_RUNTIME_DIR/$dylib"
              if [ ! -f "$source" ]; then
                source="$(find "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift" -type f -name "$dylib" -path '*/iphoneos/*' -print -quit)"
              fi
              if [ ! -f "$source" ]; then
                echo "::error::Xcode 27 GM does not contain required Swift support dylib: $dylib"
                exit 1
              fi
              cp -p "$source" "$SWIFT_SUPPORT/$dylib"
            done < probe-logs/swift-runtime-deps.txt
          fi

          test -d "$SWIFT_SUPPORT"
          test -f "$SWIFT_SUPPORT/libswiftCore.dylib"

          echo "SwiftSupport generated for upload:"
          find "$SWIFT_SUPPORT" -maxdepth 1 -type f -name 'libswift*.dylib' -print | sort \
            | tee probe-logs/swift-support-files.txt

          if [ -f probe-logs/swift-runtime-deps.txt ]; then
            while IFS= read -r dylib; do
              [ -n "$dylib" ] || continue
              test -f "$SWIFT_SUPPORT/$dylib"
            done < probe-logs/swift-runtime-deps.txt
          fi

          # Rebuild the distribution container while preserving every top-level
          # item Xcode exported (Payload, Symbols, Signatures) and adding SwiftSupport.
          rm -f "$IPA_PATH"
          (
            cd build/inspect
            items=(Payload SwiftSupport)
            [ -d Symbols ] && items+=(Symbols)
            [ -d Signatures ] && items+=(Signatures)
            /usr/bin/zip -qry "../testflight-export/LiveContainer.ipa" "${items[@]}"
          )
          IPA_PATH="$PWD/build/testflight-export/LiveContainer.ipa"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          /usr/bin/unzip -l "$IPA_PATH" | tee probe-logs/ipa-file-list.txt
          grep -q 'SwiftSupport/iphoneos/libswiftCore.dylib' probe-logs/ipa-file-list.txt
          grep -q 'SwiftSupport/iphoneos/libswiftFoundation.dylib' probe-logs/ipa-file-list.txt

          codesign -d --entitlements :- "$APP_PATH" > probe-logs/signed-entitlements.plist 2> probe-logs/codesign.txt || true
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > probe-logs/profile.plist

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          signed = {}
          signed_path = Path("probe-logs/signed-entitlements.plist")
          if signed_path.exists() and signed_path.stat().st_size:
              try:
                  signed = plistlib.loads(signed_path.read_bytes())
              except Exception as exc:
                  print("Could not parse signed entitlements:", exc)

          profile = plistlib.loads(Path("probe-logs/profile.plist").read_bytes())
          profile_ent = profile.get("Entitlements", {})

          signed_gta = signed.get("get-task-allow")
          profile_gta = profile_ent.get("get-task-allow")
          print("SIGNED get-task-allow =", signed_gta)
          print("PROFILE get-task-allow =", profile_gta)
          print("SIGNED application-identifier =", signed.get("application-identifier"))
          print("PROFILE application-identifier =", profile_ent.get("application-identifier"))

          Path("probe-logs/result.txt").write_text(
              f"signed_get_task_allow={signed_gta!r}\n"
              f"profile_get_task_allow={profile_gta!r}\n"
          )
          PY

      - name: Validate with App Store Connect
        id: validate
        if: ${{ steps.export.outcome == 'success' && env.ASC_APP_RECORD_EXISTS == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --validate-app -f "${IPA_PATH}" --type ios --apiKey "${APP_STORE_CONNECT_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" 2>&1 | tee probe-logs/validation.log

      - name: Upload to TestFlight
        id: upload
        if: ${{ steps.export.outcome == 'success' && env.ASC_APP_RECORD_EXISTS == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app -f "${IPA_PATH}" --type ios --apple-id "${ASC_APP_APPLE_ID}" --apiKey "${APP_STORE_CONNECT_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" 2>&1 | tee probe-logs/upload.log

      - name: Write result summary
        if: always()
        run: |
          {
            echo "# LiveContainer TestFlight get-task-allow probe"
            echo
            echo "Source: migrate-liveexec-nightly@681df870dbcd90236af50c997fc91d40e2fb9458"
            echo "Bundle ID: ${PROBE_BUNDLE_ID}"
            echo "ASC app record: ${ASC_APP_RECORD_EXISTS:-unknown}"
            echo "Export: ${{ steps.export.outcome }}"
            echo "Validation: ${{ steps.validate.outcome }}"
            echo "Upload: ${{ steps.upload.outcome }}"
            if [ -f probe-logs/result.txt ]; then
              echo
              cat probe-logs/result.txt
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: livecontainer-testflight-get-task-allow-${{ github.run_number }}
          path: |
            probe-logs
            build/testflight-export/*.ipa
            build/ExportOptions.probe.plist
          if-no-files-found: warn
          retention-days: 30
