name: TestFlight get-task-allow probe

on:
  push:
    branches:
      - tf-get-task-allow-probe-20260928
    paths:
      - '.github/workflows/testflight-get-task-allow-probe.yml'
      - '.github/scripts/patch-appstore-probe.py'
      - 'LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: LiveContainer TestFlight get-task-allow
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      PROBE_BUNDLE_ID: com.nightvibes.prism.39A8Q3T3TR
      PROBE_VERSION: 0.0.1
      PROBE_BUILD: ${{ github.run_number }}

    steps:
      - name: Checkout LiveContainer mirror
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify mirrored LiveContainer source
        run: |
          set -euo pipefail
          test "$(cat .livecontainer-source-sha)" = "681df870dbcd90236af50c997fc91d40e2fb9458"
          test -f LiveContainer/LCBootstrap.m
          test -f LiveContainer.xcodeproj/project.pbxproj
          grep -q 'LCSelected32BitEmulator' LiveContainer/LCBootstrap.m
          git submodule status

      - name: Validate Apple secrets
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Select Xcode 27 GM
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_27.app"
          test -d "${XCODE_PATH}"
          sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"

          VERSION="$(xcodebuild -version)"
          echo "${VERSION}"
          echo "${VERSION}" | grep -q '^Xcode 27'
          xcrun --sdk iphoneos --show-sdk-version

      - name: Create or locate App Store Connect app
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --quiet --upgrade pip
          .probe-venv/bin/python -m pip install --quiet PyJWT cryptography
          .probe-venv/bin/python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import jwt

          BASE = "https://api.appstoreconnect.apple.com"
          KEY_ID = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          ISSUER_ID = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          raw_key = os.environ["APP_STORE_CONNECT_API_KEY_P8"].strip()
          bundle_id = os.environ["PROBE_BUNDLE_ID"]

          def normalize_key(value):
              value = value.replace("\\n", "\n").strip()
              if "BEGIN PRIVATE KEY" in value or "BEGIN EC PRIVATE KEY" in value:
                  return value
              compact = "".join(value.split())
              return base64.b64decode(compact + "=" * (-len(compact) % 4)).decode()

          PRIVATE_KEY = normalize_key(raw_key)

          def make_token():
              now = int(time.time())
              return jwt.encode(
                  {"iss": ISSUER_ID, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                  PRIVATE_KEY,
                  algorithm="ES256",
                  headers={"kid": KEY_ID, "typ": "JWT"},
              )

          def request(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"Authorization": "Bearer " + make_token(), "Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"{method} {path} -> HTTP {exc.code}: {body[:2000]}")

          bundle_ids = [
              bundle_id,
              bundle_id + ".LiveProcess",
              bundle_id + ".LaunchAppExtension",
              bundle_id + ".ShareExtension",
          ]
          for identifier in bundle_ids:
              q = urllib.parse.urlencode({"filter[identifier]": identifier, "limit": "10"})
              rows = request("GET", "/v1/bundleIds?" + q).get("data", [])
              if not rows:
                  created = request("POST", "/v1/bundleIds", {
                      "data": {
                          "type": "bundleIds",
                          "attributes": {
                              "identifier": identifier,
                              "name": ("LiveContainer NV33 " + identifier.split(".")[-1])[:100],
                              "platform": "IOS"
                          }
                      }
                  })["data"]
                  print("Created Bundle ID:", identifier, created["id"])
              else:
                  print("Bundle ID already exists:", identifier, rows[0]["id"])

          q = urllib.parse.urlencode({"filter[bundleId]": bundle_id, "limit": "10"})
          apps = request("GET", "/v1/apps?" + q).get("data", [])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              if not apps:
                  print("No App Store Connect app record exists yet for:", bundle_id)
                  f.write("ASC_APP_RECORD_EXISTS=false\n")
              else:
                  app = apps[0]
                  attrs = app.get("attributes", {})
                  app_id = app["id"]
                  apple_id = attrs.get("appleId") or app_id
                  print("App Store Connect app record already exists.")
                  print("ASC app id:", app_id)
                  print("Apple id:", apple_id)
                  f.write("ASC_APP_RECORD_EXISTS=true\n")
                  f.write(f"ASC_APP_ID={app_id}\n")
                  f.write(f"ASC_APP_APPLE_ID={apple_id}\n")
          PY

      - name: Prepare App Store signing probe entitlements
        run: |
          set -euo pipefail
          cat > entitlements.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          EOF

          for entitlement in LiveProcess/LiveProcess.entitlements LaunchAppExtension/LaunchAppExtension.entitlements ShareExtension/ShareExtension.entitlements
          do
            cat > "$entitlement" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          EOF
          done

          plutil -p entitlements.xml

      - name: Patch App Store public API compatibility
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-appstore-probe.py

      - name: Build current ElleKit for iOS
        run: |
          set -euo pipefail
          ELLEKIT_SRC="${RUNNER_TEMP}/ellekit"
          ELLEKIT_DD="${RUNNER_TEMP}/ellekit-derived"
          rm -rf "$ELLEKIT_SRC" "$ELLEKIT_DD"

          git clone --depth 1 https://github.com/tealbathingsuit/ellekit.git "$ELLEKIT_SRC"
          mkdir -p probe-logs

          pushd "$ELLEKIT_SRC" >/dev/null
          xcodebuild -scheme ellekit -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$ELLEKIT_DD" IPHONEOS_DEPLOYMENT_TARGET=15.0 ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" LD_DYLIB_INSTALL_NAME="@rpath/CydiaSubstrate.framework/CydiaSubstrate" build 2>&1 | tee "$GITHUB_WORKSPACE/probe-logs/ellekit-build.log"
          popd >/dev/null

          ELLEKIT_BIN="$ELLEKIT_DD/Build/Products/Release-iphoneos/libellekit.dylib"
          test -f "$ELLEKIT_BIN"
          case "$ELLEKIT_BIN" in
            *.dSYM/*) echo "::error::Selected dSYM instead of ElleKit product"; exit 1 ;;
          esac

          echo "Built ElleKit product: $ELLEKIT_BIN"
          /usr/bin/file "$ELLEKIT_BIN"
          /usr/bin/otool -l "$ELLEKIT_BIN" | tee probe-logs/ellekit-load-commands.txt
          /usr/bin/otool -L "$ELLEKIT_BIN" | tee probe-logs/ellekit-linked-libraries.txt

          python3 - "$ELLEKIT_BIN" <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          if len(data) < 32 or struct.unpack_from("<I", data, 0)[0] != 0xFEEDFACF:
              raise SystemExit("rebuilt ElleKit is not a little-endian arm64 Mach-O")

          _, _, _, _, ncmds, _, _, _ = struct.unpack_from("<IiiIIIII", data, 0)
          off = 32
          platform = None
          minos = None
          legacy_min = False
          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from("<II", data, off)
              if cmdsize < 8 or off + cmdsize > len(data):
                  raise SystemExit("malformed ElleKit Mach-O load commands")
              if cmd == 0x32 and cmdsize >= 24:  # LC_BUILD_VERSION
                  platform = struct.unpack_from("<I", data, off + 8)[0]
                  minos = struct.unpack_from("<I", data, off + 12)[0]
              elif cmd == 0x25:  # LC_VERSION_MIN_IPHONEOS
                  legacy_min = True
              off += cmdsize

          print("LC_BUILD_VERSION platform =", platform)
          print("LC_BUILD_VERSION minos =", hex(minos or 0))
          print("legacy LC_VERSION_MIN_IPHONEOS =", legacy_min)
          if platform != 2:
              raise SystemExit(f"ElleKit is not built for PLATFORM_IOS: {platform}")
          if not minos or minos < 0x000F0000:
              raise SystemExit(f"ElleKit minimum iOS is below 15.0: {minos}")
          PY

          DEST="Resources/Frameworks/CydiaSubstrate.framework/CydiaSubstrate"
          cp "$ELLEKIT_BIN" "$DEST"
          chmod 0755 "$DEST"

          # The framework LC_ID_DYLIB is set at link time above.
          # Avoid install_name_tool: Xcode 27's output layout is not safely
          # rewriteable by that tool after link.
          PLIST="Resources/Frameworks/CydiaSubstrate.framework/Info.plist"
          cat > "$PLIST" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>CydiaSubstrate</string>
            <key>CFBundleIdentifier</key>
            <string>com.nightvibes.prism.cydiasubstrate</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>CydiaSubstrate</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
              <string>iPhoneOS</string>
            </array>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
          </dict>
          </plist>
          EOF

          /usr/bin/otool -D "$DEST" | tee probe-logs/ellekit-install-name.txt
          grep -q '@rpath/CydiaSubstrate.framework/CydiaSubstrate' probe-logs/ellekit-install-name.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$PLIST" | grep -qx 'FMWK'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST" | grep -qx 'CydiaSubstrate'

          echo "Replaced bundled CydiaSubstrate compatibility binary with current iOS ElleKit framework."

      - name: Build unsigned LiveContainer archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          rm -rf build/TestFlightProbe.xcarchive build/testflight-export probe-logs
          mkdir -p build probe-logs

          xcodebuild archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TestFlightProbe.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            LIVECONTAINER_BUNDLE_IDENTIFIER="${PROBE_BUNDLE_ID}" \
            CURRENT_PROJECT_VERSION="${PROBE_BUILD}" \
            MARKETING_VERSION="${PROBE_VERSION}" \
            ENABLE_BITCODE=NO \
            STRIP_BITCODE_FROM_COPIED_FILES=NO \
            COPY_PHASE_STRIP=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            EMBEDDED_CONTENT_CONTAINS_SWIFT=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee probe-logs/archive.log

          test -d build/TestFlightProbe.xcarchive/Products/Applications/LiveContainer.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/TestFlightProbe.xcarchive/Products/Applications/LiveContainer.app/Info.plist

      - name: Remove App Store-invalid optional components
        run: |
          set -euo pipefail
          APP="build/TestFlightProbe.xcarchive/Products/Applications/LiveContainer.app"

          # These are optional LiveContainer integration/multitask/tweak components that
          # currently depend on private extension points or private APIs. Keep them out
          # of this TestFlight flavor rather than attempting to disguise those APIs.
          rm -rf "$APP/PlugIns"
          rm -rf "$APP/Frameworks/SideStoreSupport.framework"

          # Preserve LiveContainer's tweak-injection path. The bundled legacy
          # ElleKit binary was replaced from source before archive, so both
          # CydiaSubstrate compatibility and TweakLoader remain in this flavor.
          test -f "$APP/Frameworks/CydiaSubstrate.framework/CydiaSubstrate"
          test -f "$APP/Frameworks/TweakLoader.dylib"

          # App Store validation requires a launch screen for iPad multitasking.
          /usr/libexec/PlistBuddy -c 'Delete :UILaunchStoryboardName' "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Delete :UILaunchScreen' "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UILaunchScreen dict' "$APP/Info.plist"

          # Give every probe a unique App Store build number.
          TF_BUILD="$((100000 + GITHUB_RUN_NUMBER))"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TF_BUILD" "$APP/Info.plist"
          echo "TESTFLIGHT_BUILD_NUMBER=$TF_BUILD" >> "$GITHUB_ENV"

          echo "Remaining embedded payload:"
          find "$APP/Frameworks" -maxdepth 2 -type f -print | sort || true
          find "$APP/PlugIns" -maxdepth 2 -type f -print 2>/dev/null | sort || true

      - name: Populate Swift runtime support
        run: |
          set -euo pipefail

          ARCHIVE="build/TestFlightProbe.xcarchive"
          APP="$ARCHIVE/Products/Applications/LiveContainer.app"
          FRAMEWORKS="$APP/Frameworks"
          SUPPORT_ROOT="$ARCHIVE/SwiftSupport/iphoneos"
          TOOLCHAIN_SWIFT="/Applications/Xcode_27.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"

          test -f "$APP/LiveContainer"
          test -f "$FRAMEWORKS/CydiaSubstrate.framework/CydiaSubstrate"
          test -f "$FRAMEWORKS/TweakLoader.dylib"
          test -d "$TOOLCHAIN_SWIFT"

          rm -rf "$ARCHIVE/SwiftSupport"
          mkdir -p "$SUPPORT_ROOT" "$FRAMEWORKS"

          # First let Xcode's own tool resolve anything it considers back-deployable.
          xcrun swift-stdlib-tool \
            --copy \
            --verbose \
            --platform iphoneos \
            --scan-executable "$APP/LiveContainer" \
            --scan-folder "$FRAMEWORKS" \
            --destination "$FRAMEWORKS" \
            --unsigned-destination "$ARCHIVE/SwiftSupport" \
            2>&1 | tee probe-logs/swift-stdlib-copy.log || true

          # ElleKit is deliberately rebuilt with iOS 15. Xcode therefore treats its
          # Swift runtime as OS-provided and may copy nothing, while App Store Connect
          # still requires SwiftSupport for this embedded Swift compatibility framework.
          # Scan every Mach-O in the final archive and copy only the exact /usr/lib/swift
          # dylibs that those binaries reference, using the current Xcode 27 GM toolchain.
          : > probe-logs/swift-runtime-required.txt
          {
            printf '%s\n' "$APP/LiveContainer"
            find "$FRAMEWORKS" -type f -print
          } | while IFS= read -r candidate; do
            [ -f "$candidate" ] || continue
            if /usr/bin/file "$candidate" | grep -q 'Mach-O'; then
              /usr/bin/otool -L "$candidate" 2>/dev/null || true
            fi
          done | awk '/\/usr\/lib\/swift\/libswift[^ ]*\.dylib/ {print $1}' \
            | sed 's#.*/##' \
            | sort -u \
            | tee probe-logs/swift-runtime-required.txt

          test -s probe-logs/swift-runtime-required.txt

          : > probe-logs/swift-runtime-sources.txt
          : > probe-logs/swift-runtime-packaged.txt
          : > probe-logs/swift-runtime-os-only.txt
          while IFS= read -r dylib; do
            [ -n "$dylib" ] || continue

            source=""
            for candidate in \
              "$TOOLCHAIN_SWIFT/$dylib" \
              "/Applications/Xcode_27.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/iphoneos/$dylib"
            do
              if [ -f "$candidate" ]; then
                source="$candidate"
                break
              fi
            done

            if [ -z "$source" ]; then
              source="$(find /Applications/Xcode_27.app/Contents/Developer \
                -type f -name "$dylib" -path '*iphoneos*' -print -quit 2>/dev/null || true)"
            fi

            if [ -z "$source" ] || [ ! -f "$source" ]; then
              echo "$dylib" | tee -a probe-logs/swift-runtime-os-only.txt
              echo "OS-provided Swift runtime; no redistributable Xcode 27 copy: $dylib"
              continue
            fi

            echo "$dylib <- $source" | tee -a probe-logs/swift-runtime-sources.txt
            echo "$dylib" >> probe-logs/swift-runtime-packaged.txt
            cp -p "$source" "$FRAMEWORKS/$dylib"
            cp -p "$source" "$SUPPORT_ROOT/$dylib"
          done < probe-logs/swift-runtime-required.txt

          echo "Required Swift runtime dylibs:"
          cat probe-logs/swift-runtime-required.txt
          echo "Packaged Swift runtime dylibs:"
          cat probe-logs/swift-runtime-packaged.txt
          echo "OS-only Swift runtime dylibs:"
          cat probe-logs/swift-runtime-os-only.txt || true
          test -s probe-logs/swift-runtime-packaged.txt

          echo "Embedded app Swift dylibs:"
          find "$FRAMEWORKS" -maxdepth 1 -type f -name 'libswift*.dylib' -print | sort | tee probe-logs/app-swift-dylibs.txt

          echo "Archive SwiftSupport:"
          find "$SUPPORT_ROOT" -maxdepth 1 -type f -name 'libswift*.dylib' -print | sort | tee probe-logs/archive-swift-support.txt

          while IFS= read -r dylib; do
            [ -n "$dylib" ] || continue
            test -f "$FRAMEWORKS/$dylib"
            test -f "$SUPPORT_ROOT/$dylib"
            cmp "$FRAMEWORKS/$dylib" "$SUPPORT_ROOT/$dylib"
          done < probe-logs/swift-runtime-packaged.txt

          test -n "$(find "$SUPPORT_ROOT" -maxdepth 1 -type f -name 'libswift*.dylib' -print -quit)"
          test -n "$(find "$FRAMEWORKS" -maxdepth 1 -type f -name 'libswift*.dylib' -print -quit)"

      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          printf '%s' "${APP_STORE_CONNECT_API_KEY_P8}" > "${PWD}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Export App Store Connect signed IPA
        id: export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -uo pipefail
          mkdir -p build/testflight-export

          cat > build/ExportOptions.probe.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          set +e
          xcodebuild \
            -exportArchive \
            -archivePath build/TestFlightProbe.xcarchive \
            -exportOptionsPlist build/ExportOptions.probe.plist \
            -exportPath build/testflight-export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${PWD}/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}" \
            2>&1 | tee probe-logs/export.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Inspect signed IPA
        if: ${{ steps.export.outcome == 'success' }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/testflight-export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          rm -rf build/inspect
          mkdir -p build/inspect
          unzip -q "$IPA_PATH" -d build/inspect
          APP_PATH="$(find build/inspect/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          # Preserve and verify the current guest tweak runtime.
          SUBSTRATE_BIN="$APP_PATH/Frameworks/CydiaSubstrate.framework/CydiaSubstrate"
          TWEAK_LOADER="$APP_PATH/Frameworks/TweakLoader.dylib"
          test -f "$SUBSTRATE_BIN"
          test -f "$TWEAK_LOADER"

          /usr/bin/otool -l "$SUBSTRATE_BIN" | tee probe-logs/exported-ellekit-load-commands.txt
          /usr/bin/otool -L "$SUBSTRATE_BIN" | tee probe-logs/exported-ellekit-linked-libraries.txt
          /usr/bin/otool -D "$SUBSTRATE_BIN" | tee probe-logs/exported-ellekit-install-name.txt
          grep -q '@rpath/CydiaSubstrate.framework/CydiaSubstrate' probe-logs/exported-ellekit-install-name.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP_PATH/Frameworks/CydiaSubstrate.framework/Info.plist" | grep -qx 'FMWK'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Frameworks/CydiaSubstrate.framework/Info.plist" | grep -qx 'CydiaSubstrate'

          python3 - "$SUBSTRATE_BIN" <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          if len(data) < 32 or struct.unpack_from("<I", data, 0)[0] != 0xFEEDFACF:
              raise SystemExit("exported ElleKit is not a little-endian arm64 Mach-O")
          _, _, _, _, ncmds, _, _, _ = struct.unpack_from("<IiiIIIII", data, 0)
          off = 32
          platform = None
          minos = None
          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from("<II", data, off)
              if cmd == 0x32 and cmdsize >= 24:
                  platform = struct.unpack_from("<I", data, off + 8)[0]
                  minos = struct.unpack_from("<I", data, off + 12)[0]
              off += cmdsize
          print("Exported ElleKit platform =", platform, "minos =", hex(minos or 0))
          if platform != 2:
              raise SystemExit(f"exported ElleKit platform is not iOS: {platform}")
          if not minos or minos < 0x000F0000:
              raise SystemExit(f"exported ElleKit deployment target is too old: {minos}")
          PY

          # Fail closed: prior uploads were rejected with ITMS-90426.
          # The final IPA must physically contain the top-level SwiftSupport payload.
          test -d build/inspect/SwiftSupport/iphoneos
          test -n "$(find build/inspect/SwiftSupport/iphoneos -maxdepth 1 -type f -name 'libswift*.dylib' -print -quit)"
          echo "Exported SwiftSupport:"
          find build/inspect/SwiftSupport/iphoneos -maxdepth 1 -type f -name 'libswift*.dylib' -print | sort | tee probe-logs/exported-swift-support.txt

          echo "IPA top-level SwiftSupport verification:"
          /usr/bin/unzip -l "$IPA_PATH" | grep 'SwiftSupport/iphoneos/libswift' | tee probe-logs/ipa-swift-support.txt

          codesign -d --entitlements :- "$APP_PATH" > probe-logs/signed-entitlements.plist 2> probe-logs/codesign.txt || true
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > probe-logs/profile.plist

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          signed = {}
          signed_path = Path("probe-logs/signed-entitlements.plist")
          if signed_path.exists() and signed_path.stat().st_size:
              try:
                  signed = plistlib.loads(signed_path.read_bytes())
              except Exception as exc:
                  print("Could not parse signed entitlements:", exc)

          profile = plistlib.loads(Path("probe-logs/profile.plist").read_bytes())
          profile_ent = profile.get("Entitlements", {})

          signed_gta = signed.get("get-task-allow")
          profile_gta = profile_ent.get("get-task-allow")
          print("SIGNED get-task-allow =", signed_gta)
          print("PROFILE get-task-allow =", profile_gta)
          print("SIGNED application-identifier =", signed.get("application-identifier"))
          print("PROFILE application-identifier =", profile_ent.get("application-identifier"))

          Path("probe-logs/result.txt").write_text(
              f"signed_get_task_allow={signed_gta!r}\n"
              f"profile_get_task_allow={profile_gta!r}\n"
          )
          PY

      - name: Validate with App Store Connect
        id: validate
        if: ${{ steps.export.outcome == 'success' && env.ASC_APP_RECORD_EXISTS == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --validate-app -f "${IPA_PATH}" --type ios --apiKey "${APP_STORE_CONNECT_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" 2>&1 | tee probe-logs/validation.log

      - name: Upload to TestFlight
        id: upload
        if: ${{ steps.export.outcome == 'success' && env.ASC_APP_RECORD_EXISTS == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app -f "${IPA_PATH}" --type ios --apple-id "${ASC_APP_APPLE_ID}" --apiKey "${APP_STORE_CONNECT_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" 2>&1 | tee probe-logs/upload.log

      - name: Write result summary
        if: always()
        run: |
          {
            echo "# LiveContainer TestFlight get-task-allow probe"
            echo
            echo "Source: migrate-liveexec-nightly@681df870dbcd90236af50c997fc91d40e2fb9458"
            echo "Bundle ID: ${PROBE_BUNDLE_ID}"
            echo "ASC app record: ${ASC_APP_RECORD_EXISTS:-unknown}"
            echo "Export: ${{ steps.export.outcome }}"
            echo "Validation: ${{ steps.validate.outcome }}"
            echo "Upload: ${{ steps.upload.outcome }}"
            if [ -f probe-logs/result.txt ]; then
              echo
              cat probe-logs/result.txt
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: livecontainer-testflight-get-task-allow-${{ github.run_number }}
          path: |
            probe-logs
            build/testflight-export/*.ipa
            build/ExportOptions.probe.plist
          if-no-files-found: warn
          retention-days: 30
