name: TestFlight Public Link

on:
  workflow_dispatch:
    inputs:
      beta_group_name:
        description: External TestFlight beta group name
        required: true
        default: "døPe Public Beta"

permissions:
  contents: read

jobs:
  public-link:
    name: Create or print public TestFlight link
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or print public TestFlight link
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DOPI_APP_BUNDLE_ID: app.mo1.player.39A8Q3T3TR
          DOPI_APP_LOCALE: en-US
          DOPI_BETA_GROUP_NAME: ${{ inputs.beta_group_name }}
          DOPI_BETA_APP_DESCRIPTION: >-
            døPe is a retro music player for iPhone and iPad. Test MP3 import, Apple Music library browsing, album carousel, lyrics, equalizer controls, song transitions, and radial navigation.
          DOPI_BETA_FEEDBACK_EMAIL: bobbytatum12345@gmail.com
          DOPI_BETA_CONTACT_EMAIL: bobbytatum12345@gmail.com
          DOPI_BETA_REVIEW_NOTES: >-
            No demo account is required. Please test local MP3 import, Apple Music connection, playback, lyrics, equalizer, album carousel, and song transitions.
          DOPI_PRIVACY_POLICY_URL: https://github.com/NightVibes33/mo1/blob/main/privacy-policy.md
          DOPI_USES_NON_EXEMPT_ENCRYPTION: "false"
        run: ruby tool/app_store_connect_public_link.rb
