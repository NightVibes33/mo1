name: TestFlight Public Link

on:
  workflow_dispatch:
    inputs:
      beta_group_name:
        description: External TestFlight beta group name
        required: true
        default: "doPi Public Beta"

permissions:
  contents: read

jobs:
  public-link:
    name: Create or print public TestFlight link
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or print public TestFlight link
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DOPI_APP_BUNDLE_ID: app.mo1.player.39A8Q3T3TR
          DOPI_APP_LOCALE: en-US
          DOPI_BETA_GROUP_NAME: ${{ inputs.beta_group_name }}
          DOPI_BETA_APP_DESCRIPTION: >-
            doPi is a retro music player for iPhone and iPad. Test local MP3 import, optional Apple Music browsing for devices signed into an active Apple Music subscription, album carousel, lyrics, equalizer controls, song transitions, and radial navigation.
          DOPI_BETA_FEEDBACK_EMAIL: bobbytatum12345@gmail.com
          DOPI_BETA_CONTACT_EMAIL: bobbytatum12345@gmail.com
          DOPI_BETA_REVIEW_NOTES: >-
            No demo account is required. Reviewers can fully test local MP3 import and on-device playback without signing in. Apple Music features are optional and require a device signed into an active Apple Music subscription. Camera and photo library access are only used if the reviewer chooses custom album artwork.
          DOPI_PRIVACY_POLICY_URL: https://cdn.jsdelivr.net/gh/NightVibes33/mo1@main/privacy-policy.html
          DOPI_USES_NON_EXEMPT_ENCRYPTION: "false"
        run: ruby tool/app_store_connect_public_link.rb
