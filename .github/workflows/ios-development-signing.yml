name: Generate iOS Signing Assets

run-name: iOS signing — ${{ inputs.signing_mode }}

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Signing / provisioning mode"
        required: true
        type: choice
        default: apple_development
        options:
          - apple_development
          - ios_development_legacy
          - ad_hoc_apple_distribution
          - ad_hoc_ios_distribution_legacy
          - app_store_apple_distribution
          - app_store_ios_distribution_legacy
      device_udid:
        description: "iPhone/iPad UDID (required for Development + Ad Hoc; ignored for App Store)"
        required: false
        type: string
      bundle_identifier:
        description: "Bundle ID (blank = wildcard for Development/Ad Hoc; REQUIRED for App Store)"
        required: false
        type: string
      p12_password:
        description: "Password to protect the generated .p12"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ios-signing-${{ github.actor }}
  cancel-in-progress: false

env:
  SIGNING_RELEASE_TAG: ios-development-signing

jobs:
  generate:
    name: Generate selectable iOS P12 + mobileprovision ZIP
    runs-on: macos-26-intel
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Protect and validate inputs
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          DEVICE_UDID: ${{ inputs.device_udid }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
          P12_PASSWORD: ${{ inputs.p12_password }}
        run: |
          set -euo pipefail
          echo "::add-mask::${P12_PASSWORD}"
          if [ -n "${DEVICE_UDID}" ]; then
            echo "::add-mask::${DEVICE_UDID}"
          fi

          case "${SIGNING_MODE}" in
            apple_development|ios_development_legacy|ad_hoc_apple_distribution|ad_hoc_ios_distribution_legacy)
              if [[ ! "${DEVICE_UDID}" =~ ^[A-Za-z0-9-]{20,64}$ ]]; then
                echo "::error::${SIGNING_MODE} requires a valid device UDID."
                exit 1
              fi
              ;;
            app_store_apple_distribution|app_store_ios_distribution_legacy)
              if [ -z "${BUNDLE_IDENTIFIER}" ]; then
                echo "::error::${SIGNING_MODE} requires an explicit bundle identifier."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown signing mode: ${SIGNING_MODE}"
              exit 1
              ;;
          esac

          if [ -z "${P12_PASSWORD}" ]; then
            echo "::error::P12 password must not be empty."
            exit 1
          fi
          if [ "${#P12_PASSWORD}" -gt 256 ]; then
            echo "::error::P12 password is too long."
            exit 1
          fi
          if [ -n "${BUNDLE_IDENTIFIER}" ] && [[ ! "${BUNDLE_IDENTIFIER}" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{1,253}[A-Za-z0-9]$ ]]; then
            echo "::error::Bundle identifier has an unexpected format."
            exit 1
          fi

      - name: Validate Apple API secrets
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_P8 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Prepare Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .signing-venv
          .signing-venv/bin/python -m pip install --quiet --upgrade pip
          .signing-venv/bin/python -m pip install --quiet PyJWT cryptography

      - name: Open private draft release storage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${SIGNING_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${SIGNING_RELEASE_TAG}" \
              --draft \
              --title "iOS Signing Assets" \
              --notes "Private draft release used by the mo1 iOS signing generator. Do not publish this release."
          fi

      - name: Generate fresh certificate and provisioning profile
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
          DEVICE_UDID: ${{ inputs.device_udid }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
          P12_PASSWORD: ${{ inputs.p12_password }}
        run: |
          set -euo pipefail
          echo "::add-mask::${P12_PASSWORD}"
          if [ -n "${DEVICE_UDID}" ]; then
            echo "::add-mask::${DEVICE_UDID}"
          fi
          rm -rf output
          .signing-venv/bin/python .github/scripts/create_ios_development_signing.py

      - name: Verify generated P12 and profile
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          DEVICE_UDID: ${{ inputs.device_udid }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
          P12_PASSWORD: ${{ inputs.p12_password }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::${P12_PASSWORD}"
          if [ -n "${DEVICE_UDID}" ]; then
            echo "::add-mask::${DEVICE_UDID}"
          fi

          openssl pkcs12 \
            -in output/signing-certificate.p12 \
            -passin "pass:${P12_PASSWORD}" \
            -noout

          security cms -D -i output/profile.mobileprovision > "${RUNNER_TEMP}/profile.plist"

          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist" \
          SIGNING_MODE="${SIGNING_MODE}" \
          DEVICE_UDID="${DEVICE_UDID}" \
          BUNDLE_IDENTIFIER="${BUNDLE_IDENTIFIER}" \
          APPLE_TEAM_ID="${APPLE_TEAM_ID}" \
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          profile = plistlib.loads(Path(os.environ["PROFILE_PLIST"]).read_bytes())
          mode = os.environ["SIGNING_MODE"]
          expected_udid = os.environ.get("DEVICE_UDID", "")
          bundle_id = os.environ.get("BUNDLE_IDENTIFIER", "")
          team_id = os.environ["APPLE_TEAM_ID"]

          development = mode in {"apple_development", "ios_development_legacy"}
          device_bound = mode in {
              "apple_development",
              "ios_development_legacy",
              "ad_hoc_apple_distribution",
              "ad_hoc_ios_distribution_legacy",
          }
          app_store = mode in {
              "app_store_apple_distribution",
              "app_store_ios_distribution_legacy",
          }

          devices = profile.get("ProvisionedDevices", [])
          if device_bound and expected_udid not in devices:
              raise SystemExit("Generated profile does not contain the requested UDID")
          if app_store and devices:
              raise SystemExit("App Store profile unexpectedly contains ProvisionedDevices")

          entitlements = profile.get("Entitlements", {})
          get_task_allow = bool(entitlements.get("get-task-allow", False))
          if development and not get_task_allow:
              raise SystemExit("Development profile has get-task-allow=false")
          if not development and get_task_allow:
              raise SystemExit("Distribution profile unexpectedly has get-task-allow=true")

          app_identifier = entitlements.get("application-identifier", "")
          if bundle_id:
              if not app_identifier.endswith("." + bundle_id):
                  raise SystemExit(
                      f"Profile App ID does not match requested bundle ID: {app_identifier!r}"
                  )
          else:
              if not app_identifier.endswith(".*"):
                  raise SystemExit(
                      f"Expected wildcard profile but application-identifier={app_identifier!r}"
                  )

          profile_team_ids = profile.get("TeamIdentifier", [])
          entitlement_team_id = entitlements.get("com.apple.developer.team-identifier")
          if team_id not in profile_team_ids and entitlement_team_id != team_id:
              raise SystemExit(f"Generated profile is not for expected Apple team {team_id!r}")

          print(f"Verified signing mode: {mode}")
          print(f"Verified application identifier: {app_identifier}")
          print(f"Verified get-task-allow: {get_task_allow}")
          PY

      - name: Package signing assets as ZIP
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          DEVICE_UDID: ${{ inputs.device_udid }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
          P12_PASSWORD: ${{ inputs.p12_password }}
        run: |
          set -euo pipefail
          echo "::add-mask::${P12_PASSWORD}"
          MODE_SAFE="${SIGNING_MODE//_/-}"
          SUFFIX="${GITHUB_RUN_ID}"
          PACKAGE_NAME="ios-signing-${MODE_SAFE}-${SUFFIX}"
          PACKAGE_DIR="release-assets/${PACKAGE_NAME}"
          ZIP_PATH="release-assets/${PACKAGE_NAME}.zip"

          rm -rf release-assets
          mkdir -p "${PACKAGE_DIR}"

          cp output/signing-certificate.p12 "${PACKAGE_DIR}/signing-certificate.p12"
          cp output/profile.mobileprovision "${PACKAGE_DIR}/profile.mobileprovision"
          cp output/certificate-id.txt "${PACKAGE_DIR}/certificate-id.txt"
          cp output/signing-info.json "${PACKAGE_DIR}/signing-info.json"

          cat > "${PACKAGE_DIR}/README.txt" <<EOF
          iOS signing package

          Signing mode: ${SIGNING_MODE}
          Bundle identifier: ${BUNDLE_IDENTIFIER:-*}
          Device UDID required by this mode: $([[ "${SIGNING_MODE}" == app_store_* ]] && echo no || echo yes)

          Contents:
          - signing-certificate.p12
          - profile.mobileprovision
          - certificate-id.txt
          - signing-info.json

          The .p12 is protected by the password entered when this GitHub Actions workflow was started.
          EOF

          (
            cd "${PACKAGE_DIR}"
            /usr/bin/zip -qry "../${PACKAGE_NAME}.zip" .
          )

          test -s "${ZIP_PATH}"
          /usr/bin/unzip -l "${ZIP_PATH}"
          shasum -a 256 "${ZIP_PATH}" | tee "${ZIP_PATH}.sha256"

      - name: Upload ZIP to private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
          BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
        run: |
          set -euo pipefail
          MODE_SAFE="${SIGNING_MODE//_/-}"
          SUFFIX="${GITHUB_RUN_ID}"
          PACKAGE_NAME="ios-signing-${MODE_SAFE}-${SUFFIX}"
          ZIP_PATH="release-assets/${PACKAGE_NAME}.zip"
          SHA_PATH="${ZIP_PATH}.sha256"

          gh release upload "${SIGNING_RELEASE_TAG}" \
            "${ZIP_PATH}" \
            "${SHA_PATH}"

          gh release edit "${SIGNING_RELEASE_TAG}" \
            --draft \
            --title "iOS Signing Assets" \
            --notes "Private draft release used by the mo1 signing generator. Each run creates a fresh certificate/profile pair in the selected iOS signing mode. Do not publish this release."

          {
            echo "## iOS signing ZIP generated"
            echo
            echo "- **Mode:** \`${SIGNING_MODE}\`"
            echo "- **Bundle ID:** \`${BUNDLE_IDENTIFIER:-*}\`"
            echo "- **ZIP:** \`${PACKAGE_NAME}.zip\`"
            echo
            echo "Inside the ZIP:"
            echo "- \`signing-certificate.p12\`"
            echo "- \`profile.mobileprovision\`"
            echo "- \`certificate-id.txt\`"
            echo "- \`signing-info.json\`"
            echo "- \`README.txt\`"
            echo
            echo "The .p12 uses the password entered in the workflow form."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove local signing material
        if: always()
        shell: bash
        run: |
          rm -rf output release-assets .signing-venv
