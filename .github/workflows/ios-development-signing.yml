name: Generate iOS Development Signing Assets

run-name: Generate fresh wildcard iOS development signing assets

on:
  workflow_dispatch:
    inputs:
      device_udid:
        description: "iPhone/iPad UDID"
        required: true
        type: string
      p12_password:
        description: "Password to protect the generated .p12"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ios-development-signing
  cancel-in-progress: false

env:
  SIGNING_RELEASE_TAG: ios-development-signing

jobs:
  generate:
    name: Generate fresh wildcard P12 + mobileprovision ZIP
    runs-on: macos-26-intel
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Protect and validate inputs
        shell: bash
        env:
          DEVICE_UDID: ${{ inputs.device_udid }}
          P12_PASSWORD: ${{ inputs.p12_password }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEVICE_UDID}"
          echo "::add-mask::${P12_PASSWORD}"

          if [[ ! "${DEVICE_UDID}" =~ ^[A-Za-z0-9-]{20,64}$ ]]; then
            echo "::error::The supplied device UDID has an unexpected format."
            exit 1
          fi

          if [ -z "${P12_PASSWORD}" ]; then
            echo "::error::P12 password must not be empty."
            exit 1
          fi

          if [ "${#P12_PASSWORD}" -gt 256 ]; then
            echo "::error::P12 password is too long."
            exit 1
          fi

      - name: Validate Apple API secrets
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_P8 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Prepare Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .signing-venv
          .signing-venv/bin/python -m pip install --quiet --upgrade pip
          .signing-venv/bin/python -m pip install --quiet PyJWT cryptography

      - name: Open private draft release storage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${SIGNING_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${SIGNING_RELEASE_TAG}" \
              --draft \
              --title "iOS Development Signing Assets" \
              --notes "Private draft release used by the mo1 signing generator. Do not publish this release."
          fi

      - name: Generate a brand-new development identity and wildcard profile
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVICE_UDID: ${{ inputs.device_udid }}
          P12_PASSWORD: ${{ inputs.p12_password }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEVICE_UDID}"
          echo "::add-mask::${P12_PASSWORD}"
          rm -rf output
          .signing-venv/bin/python .github/scripts/create_ios_development_signing.py

      - name: Verify generated P12 and wildcard profile
        shell: bash
        env:
          DEVICE_UDID: ${{ inputs.device_udid }}
          P12_PASSWORD: ${{ inputs.p12_password }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEVICE_UDID}"
          echo "::add-mask::${P12_PASSWORD}"

          openssl pkcs12 \
            -in output/apple-development.p12 \
            -passin "pass:${P12_PASSWORD}" \
            -noout

          security cms -D -i output/development.mobileprovision > "${RUNNER_TEMP}/profile.plist"

          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist" DEVICE_UDID="${DEVICE_UDID}" APPLE_TEAM_ID="${APPLE_TEAM_ID}" python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          profile = plistlib.loads(Path(os.environ["PROFILE_PLIST"]).read_bytes())
          expected_udid = os.environ["DEVICE_UDID"]
          team_id = os.environ["APPLE_TEAM_ID"]

          devices = profile.get("ProvisionedDevices", [])
          if expected_udid not in devices:
              raise SystemExit("Generated profile does not contain the requested UDID")

          entitlements = profile.get("Entitlements", {})
          if not entitlements.get("get-task-allow", False):
              raise SystemExit("Generated profile is not a development profile (get-task-allow is false)")

          app_identifier = entitlements.get("application-identifier", "")
          if not app_identifier.endswith(".*"):
              raise SystemExit(
                  f"Generated profile is not universal wildcard: application-identifier={app_identifier!r}"
              )

          profile_team_ids = profile.get("TeamIdentifier", [])
          entitlement_team_id = entitlements.get("com.apple.developer.team-identifier")
          if team_id not in profile_team_ids and entitlement_team_id != team_id:
              raise SystemExit(
                  f"Generated profile is not for expected Apple team {team_id!r}"
              )

          print(f"Verified universal wildcard profile: {app_identifier}")
          print("Verified fresh development certificate + universal wildcard provisioning profile.")
          PY

      - name: Package signing assets as ZIP
        shell: bash
        env:
          P12_PASSWORD: ${{ inputs.p12_password }}
        run: |
          set -euo pipefail
          echo "::add-mask::${P12_PASSWORD}"
          SUFFIX="${GITHUB_RUN_ID}"
          PACKAGE_DIR="release-assets/ios-development-signing-${SUFFIX}"
          ZIP_PATH="release-assets/ios-development-signing-${SUFFIX}.zip"

          rm -rf release-assets
          mkdir -p "${PACKAGE_DIR}"

          cp output/apple-development.p12 "${PACKAGE_DIR}/apple-development.p12"
          cp output/development.mobileprovision "${PACKAGE_DIR}/development.mobileprovision"
          cp output/certificate-id.txt "${PACKAGE_DIR}/certificate-id.txt"
          cp output/signing-info.json "${PACKAGE_DIR}/signing-info.json"

          cat > "${PACKAGE_DIR}/README.txt" <<'EOF'
          Contents:
          - apple-development.p12
          - development.mobileprovision
          - certificate-id.txt
          - signing-info.json

          The .p12 is protected by the password entered when this GitHub Actions workflow was started.
          The provisioning profile is a wildcard iOS development profile for the supplied device UDID.
          EOF

          (
            cd "${PACKAGE_DIR}"
            /usr/bin/zip -qry "../ios-development-signing-${SUFFIX}.zip" .
          )

          test -s "${ZIP_PATH}"
          /usr/bin/unzip -l "${ZIP_PATH}"
          shasum -a 256 "${ZIP_PATH}" | tee "${ZIP_PATH}.sha256"

      - name: Upload ZIP to private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUFFIX="${GITHUB_RUN_ID}"
          ZIP_PATH="release-assets/ios-development-signing-${SUFFIX}.zip"
          SHA_PATH="${ZIP_PATH}.sha256"

          gh release upload "${SIGNING_RELEASE_TAG}" \
            "${ZIP_PATH}" \
            "${SHA_PATH}"

          gh release edit "${SIGNING_RELEASE_TAG}" \
            --draft \
            --title "iOS Development Signing Assets" \
            --notes "Private draft release used by the mo1 signing generator. Each workflow run creates a brand-new Apple Development certificate and wildcard iOS development profile, packaged as a ZIP. Do not publish this release."

          {
            echo "## Fresh wildcard iOS signing ZIP generated"
            echo
            echo "This run created a **new Apple Development certificate** and a **wildcard development profile** for the supplied device."
            echo
            echo "Download this single file from the **iOS Development Signing Assets** draft release:"
            echo "- \`ios-development-signing-${SUFFIX}.zip\`"
            echo
            echo "Inside the ZIP:"
            echo "- \`apple-development.p12\`"
            echo "- \`development.mobileprovision\`"
            echo "- \`certificate-id.txt\`"
            echo "- \`signing-info.json\`"
            echo "- \`README.txt\`"
            echo
            echo "The .p12 uses the password you entered in the workflow form."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove local signing material
        if: always()
        shell: bash
        run: |
          rm -rf output release-assets .signing-venv
